services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    ports:
      # Host 5432 is taken by a system Postgres; the container publishes on 55432.
      # Tests and local runs use DATABASE_URL=...localhost:55432.
      - "55432:5432"
    volumes:
      # PG 18+ images want the volume at the parent dir so pg_upgrade works.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "monitor.simulator.app:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      MONITOR_SEED: "42"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
