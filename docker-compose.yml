services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    ports:
      # Host 55432 is taken by the system Postgres (/usr/pgsql-18); use a
      # free host port. The container still publishes its own 5432 internally.
      - "55434:5432"
    volumes:
      # PG 18+ images want the volume at the parent dir so pg_upgrade works.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      MONITOR_SEED: "42"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
