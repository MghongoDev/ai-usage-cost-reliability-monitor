name: Database backups

on:
  schedule:
    # 02:00 UTC nightly. Hours of 0 are 10 PM ET previous day.
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  pg-dump:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Create pg dump
        run: |
          mkdir -p /tmp/dump
          # Run pg_dump inside the service container so the client version
          # always matches the server (the runner ships an older pg_dump).
          # This still dumps the empty CI service; pointing it at the deployed
          # database is tracked with the deploy work.
          docker exec ${{ job.services.postgres.id }} \
            pg_dump -U monitor -d monitor \
            > /tmp/dump/monitor-$(date +%Y%m%d-%H%M%S).sql
      - name: Upload pg dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg-dump
          path: /tmp/dump/
          retention-days: 7
