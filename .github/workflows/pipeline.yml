name: Pipeline

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

env:
  # CI runs against a PostgreSQL service container started by this workflow
  # (the job container reaches it on the service name `postgres` on port 5432).
  # The password here must match POSTGRES_PASSWORD below.
  DATABASE_URL: postgresql://monitor:monitor@postgres:5432/monitor
  SIMULATOR_URL: http://localhost:8001
  GRAFANA_ANONYMOUS_READ: "true"

jobs:
  collect-anthropic:
    runs-on: ubuntu-latest
    env:
      PROVIDER: anthropic
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: make install
      - name: Run collectors
        run: make collect
      - name: Upload collectors run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collectors-run
          path: /tmp/collectors-run.json
          retention-days: 3

  collect-openai:
    runs-on: ubuntu-latest
    env:
      PROVIDER: openai
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: make install
      - name: Run collectors
        run: make collect
      - name: Upload collectors run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collectors-run
          path: /tmp/collectors-run.json
          retention-days: 3

  probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: make install
      - name: Run probes
        run: make probe

  rules:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: make install
      - name: Run rules
        run: make rules

  quality-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: make install
      - name: Run migrate
        run: make migrate
      - name: Run lint
        run: make lint
      - name: Run typecheck
        run: make typecheck
      - name: Run tests
        run: make test
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: htmlcov/
          retention-days: 7

  dump:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Create pg dump
        run: |
          mkdir -p /tmp/dump
          PGPASSWORD=monitor pg_dump -h localhost -U monitor -d monitor \
            -f /tmp/dump/monitor-$(date +%Y%m%d-%H%M%S).sql
      - name: Upload pg dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg-dump
          path: /tmp/dump/
          retention-days: 7

  notify:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - collect-anthropic
      - collect-openai
      - probe
      - rules
      - quality-gates
      - dump
    steps:
      - name: Notify failure
        run: |
          # Dead-man's switch: if any previous job failed, ping healthchecks.io.
          if [ "${{ needs.collect-anthropic.result }}" != 'success' ] || \
             [ "${{ needs.collect-openai.result }}" != 'success' ] || \
             [ "${{ needs.probe.result }}" != 'success' ] || \
             [ "${{ needs.rules.result }}" != 'success' ] || \
             [ "${{ needs.quality-gates.result }}" != 'success' ] || \
             [ "${{ needs.dump.result }}" != 'success' ]; then
            echo "Pipeline failed - monitor may be down"
            curl -fsS "${{ secrets.HEALTHCHECKS_IO_URL }}/fail" > /dev/null || true
          else
            echo "Pipeline completed successfully"
            curl -fsS "${{ secrets.HEALTHCHECKS_IO_URL }}/ok" > /dev/null || true
          fi

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."
          format: table
          exit-code: 0

