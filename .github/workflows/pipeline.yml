name: Pipeline

# The scheduled cycle (ADR-0001): collect, probe, and evaluate rules, then
# ping the dead-man's switch. Until the deployed database exists, the cycle
# runs against a fresh Postgres service and a simulator started in the job,
# so it proves the cycle runs end to end but keeps no history.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  DATABASE_URL: postgresql://monitor:monitor@localhost:5432/monitor
  ANTHROPIC_BASE_URL: http://localhost:8001/anthropic
  OPENAI_BASE_URL: http://localhost:8001/openai

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: make install
      - name: Migrate
        run: make migrate
      - name: Start simulator
        run: |
          nohup uv run uvicorn monitor.simulator.app:app --port 8001 > simulator.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -s -o /dev/null localhost:8001/ && exit 0
            sleep 1
          done
          cat simulator.log
          exit 1
      - name: Collect
        run: make collect
      - name: Probe
        run: make probe
      - name: Evaluate rules
        run: make rules
      - name: Upload simulator log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-log
          path: simulator.log
          retention-days: 3
      - name: Ping dead-man's switch
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_IO_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$HC_URL" ]; then
            echo "HEALTHCHECKS_IO_URL not set; skipping ping"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            curl -fsS --retry 3 "$HC_URL" > /dev/null
          else
            curl -fsS --retry 3 "$HC_URL/fail" > /dev/null
          fi
