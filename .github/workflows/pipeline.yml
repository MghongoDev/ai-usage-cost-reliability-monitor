name: Pipeline

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://monitor:monitor@localhost:55432/monitor
  SIMULATOR_URL: http://localhost:8001
  GRAFANA_ANONYMOUS_READ: "true"

jobs:
  collect-anthropic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Run collectors
        run: make collect

      - name: Upload collectors run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collectors-run
          path: /tmp/collectors-run.json
          retention-days: 3

  collect-openai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Run collectors
        run: make collect

      - name: Upload collectors run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collectors-run
          path: /tmp/collectors-run.json
          retention-days: 3

  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Run probes
        run: make probe || true

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Run rules
        run: make rules

  dump:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Create pg dump
        run: |
          mkdir -p /tmp/dump
          PGPASSWORD=monitor pg_dump -h localhost -U monitor -d monitor -f /tmp/dump/monitor-$(date +%Y%m%d-%H%M%S).sql

      - name: Upload pg dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg-dump
          path: /tmp/dump/
          retention-days: 7

  notify:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify failure
        run: |
          # Dead-man's switch: if any previous job failed, ping healthchecks.io
          if [ ${{ needs.collect-anthropic.result }} != 'success' ] || \
             [ ${{ needs.collect-openai.result }} != 'success' ] || \
             [ ${{ needs.probe.result }} != 'success' ] || \
             [ ${{ needs.rules.result }} != 'success' ]; then
            echo "Pipeline failed - monitor may be down"
            curl -fsS "${{ secrets.HEALTHCHECKS_IO_URL }}/fail" > /dev/null || true
          else
            echo "Pipeline completed successfully"
            curl -fsS "${{ secrets.HEALTHCHECKS_IO_URL }}/ok" > /dev/null || true
          fi
